<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#28130e">
  <title>Прости…</title>
  <style>
    :root{color-scheme:dark;--glow:#ffb17d;--cream:#ffd0a7;--line:#e88951;--panel:rgba(37,17,12,.88)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 25%,#63351f 0,#28140f 58%,#100907 100%);color:var(--cream);font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.34;background:radial-gradient(ellipse at bottom,#a84d25 0,transparent 38%),linear-gradient(180deg,rgba(14,7,5,.08),rgba(12,6,4,.25));z-index:-1}
    .scene{max-width:1280px;margin:auto;padding:34px 28px 130px;min-height:100vh;position:relative}
    .decor{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.decor span{position:absolute;filter:drop-shadow(0 0 15px #e5793f);opacity:.65;font-size:clamp(24px,4vw,55px);animation:float 8s ease-in-out infinite}.decor span:nth-child(1){left:4%;top:5%}.decor span:nth-child(2){right:6%;top:9%;animation-delay:-3s}.decor span:nth-child(3){left:10%;bottom:14%;animation-delay:-5s}.decor span:nth-child(4){right:12%;bottom:18%;animation-delay:-2s}.decor .heart{font-size:clamp(17px,2.1vw,28px);color:#ff9b71;opacity:.48;animation:drift 12s ease-in-out infinite}.decor .h1{left:18%;top:29%;animation-delay:-5s}.decor .h2{right:19%;top:42%;animation-delay:-8s}.decor .h3{left:7%;top:65%;animation-delay:-2s}.decor .h4{right:8%;top:72%;animation-delay:-6s}.decor .h5{left:43%;top:13%;animation-delay:-3s}.decor .spark{font-size:20px;color:#ffd2a8;opacity:.62;filter:drop-shadow(0 0 9px #ff995d);animation:twinkle 3s ease-in-out infinite}.decor .s1{left:26%;top:16%}.decor .s2{right:27%;top:28%;animation-delay:-1s}.decor .s3{left:83%;top:57%;animation-delay:-2s}.decor .s4{left:14%;top:48%;animation-delay:-.5s}@keyframes float{50%{transform:translateY(-12px) rotate(8deg)}}@keyframes drift{50%{transform:translate3d(8px,-16px,0) rotate(10deg);opacity:.78}}@keyframes twinkle{50%{transform:scale(1.45);opacity:.95}}
    header{text-align:center;margin:0 auto 22px}.title{font-size:clamp(64px,10vw,118px);font-weight:400;font-style:italic;line-height:1;margin:0;color:#ffd0a7;text-shadow:0 0 12px #ff8246,0 0 35px #d84e21;letter-spacing:-.04em}.rule{display:flex;align-items:center;justify-content:center;gap:14px;margin:9px auto 12px;color:#ffa16e;font-size:27px}.rule:before,.rule:after{content:"";width:82px;height:1px;background:#e88951;box-shadow:0 0 9px #ff884e}.intro{font:clamp(17px,2.2vw,25px)/1.3 Arial,sans-serif;margin:0;text-shadow:0 0 14px #de7040}.addphotos{margin-top:14px;border:1px solid #b96a42;border-radius:999px;padding:8px 16px;background:#30170fc7;color:#ffc295;font:13px Arial,sans-serif;cursor:pointer}.addphotos:hover{background:#582919}
    .gallery{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:24px auto 30px;max-width:1120px}.tile{aspect-ratio:1/1;border:1.5px solid var(--line);border-radius:15px;overflow:hidden;background:linear-gradient(140deg,#713d28,#2b1712);box-shadow:0 0 14px #cf5c2d35;position:relative}.tile img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .5s,filter .5s;filter:saturate(.82)}.tile:hover img{transform:scale(1.05);filter:saturate(1.05)}.placeholder{width:100%;height:100%;display:grid;place-items:center;text-align:center;padding:14px;color:#e6a77e;background:radial-gradient(circle at 50% 35%,#77452f,#2a1712 70%);font:14px/1.5 Arial,sans-serif}.placeholder b{display:block;font:italic 48px Georgia;color:#ffb17d;text-shadow:0 0 18px #ff753f}.tile img:not([src]){display:none}
    .player{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(1120px,100%);min-height:116px;border:1px solid #b45f38;border-bottom:0;border-radius:28px 28px 0 0;background:linear-gradient(110deg,rgba(37,17,12,.97),rgba(58,27,17,.96));box-shadow:0 0 24px #e8733930,inset 0 0 24px #d45c2712;display:grid;grid-template-columns:96px minmax(120px,1fr) auto;align-items:center;gap:22px;padding:15px 24px calc(15px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}
    .cover{width:84px;height:84px;border-radius:12px;border:1px solid #e88951;object-fit:cover;background:linear-gradient(145deg,#efad75,#642e1e)}.track{min-width:0}.trackname{font:bold 18px Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ffd0a7}.sub{font:14px Arial,sans-serif;color:#cb845c;margin-top:5px}.controls{display:flex;align-items:center;gap:12px}.iconbtn{border:0;background:none;color:#ffbd8c;cursor:pointer;font-size:23px;padding:7px;line-height:1;filter:drop-shadow(0 0 5px #ff8a51)}.iconbtn:hover{color:#fff}.play{height:56px;width:56px;border:2px solid #ffb17d;border-radius:50%;font-size:22px;box-shadow:0 0 16px #ff7d44}.timeline{grid-column:2/4;display:grid;grid-template-columns:48px minmax(80px,1fr) 48px;align-items:center;gap:12px;margin-top:-12px;font:14px Arial,sans-serif;color:#d8875c}.seek{width:100%;accent-color:#ffc08d;cursor:pointer}.volume{width:84px;accent-color:#ffc08d}.right{display:flex;align-items:center;gap:5px;margin-left:12px}.upload{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.listbox{position:absolute;right:20px;bottom:calc(100% + 10px);width:min(320px,calc(100vw - 40px));padding:12px;border:1px solid #b45f38;border-radius:16px;background:#25130ff2;display:none;max-height:230px;overflow:auto}.listbox.open{display:block}.song{display:block;width:100%;border:0;background:transparent;color:#ffd0a7;text-align:left;padding:9px;border-radius:8px;cursor:pointer}.song:hover,.song.active{background:#743b24}.empty{font:13px/1.5 Arial,sans-serif;color:#cf956f;padding:10px}
    @media(max-width:760px){.scene{padding:28px 14px 150px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.gallery .tile:last-child{display:block}.player{grid-template-columns:58px 1fr auto;gap:12px;padding:12px 14px;border-radius:24px;bottom:10px}.cover{width:58px;height:58px}.controls{gap:2px}.iconbtn{font-size:18px;padding:5px}.play{height:46px;width:46px}.volume{display:none}.right{margin-left:2px}.timeline{grid-column:1/4;margin-top:0;grid-template-columns:38px 1fr 38px;gap:7px}.trackname{font-size:15px}.sub{font-size:12px}.right .like{display:none}}
    @media(max-width:390px){.controls .minor{display:none}.gallery{gap:7px}.player{width:calc(100% - 18px)}}
  </style>
</head>
<body>
  <div class="decor" aria-hidden="true"><span>✿</span><span>✿</span><span>✧</span><span>✿</span><span class="heart h1">♡</span><span class="heart h2">♥</span><span class="heart h3">♡</span><span class="heart h4">♥</span><span class="heart h5">♡</span><span class="spark s1">✦</span><span class="spark s2">✧</span><span class="spark s3">✦</span><span class="spark s4">✧</span></div>
  <main class="scene">
    <header><h1 class="title">Прости…</h1><div class="rule">♡</div><p class="intro">Прости меня, пожалуйста…<br>Я очень дорожу тобой и не хочу, чтобы между нами<br class="wide"> оставались обиды ♡</p><input class="upload" id="imageFiles" type="file" accept="image/*" multiple><button class="addphotos" id="addPhotos">Добавить фотографии</button></header>
    <section class="gallery" id="gallery" aria-label="Наши фотографии"></section>
  </main>
  <section class="player" aria-label="Музыкальный плеер">
    <img class="cover" id="cover" alt="Обложка песни">
    <div class="track"><div class="trackname" id="trackName">Наши моменты ♡</div><div class="sub" id="trackSub">Плейлист для тебя</div></div>
    <div class="controls"><button class="iconbtn minor" id="shuffle" title="Перемешать" aria-label="Перемешать">⤨</button><button class="iconbtn minor" id="prev" title="Предыдущий трек" aria-label="Предыдущий">|◀</button><button class="iconbtn play" id="toggle" title="Воспроизвести" aria-label="Воспроизвести">▶</button><button class="iconbtn minor" id="next" title="Следующий трек" aria-label="Следующий">▶|</button><button class="iconbtn minor" id="repeat" title="Повтор" aria-label="Повтор">⟳</button></div>
    <div class="right"><input class="upload" id="audioFiles" type="file" accept="audio/*" multiple><button class="iconbtn like" id="addMusic" title="Добавить музыку" aria-label="Добавить музыку">♡</button><button class="iconbtn" id="playlistBtn" title="Плейлист" aria-label="Открыть плейлист">☷</button></div>
    <div class="timeline"><span id="current">0:00</span><input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Позиция воспроизведения"><span id="duration">0:00</span></div>
    <div class="listbox" id="listbox"><div class="empty" id="empty">Добавь сюда аудиофайлы, чтобы собрать плейлист.</div></div>
    <audio id="audio" preload="metadata"></audio>
  </section>
  <script>
    const audio=document.querySelector('#audio'), files=document.querySelector('#audioFiles'), gallery=document.querySelector('#gallery');
    let tracks=[
      {name:'Выберу тебя',url:'assets/music/track-01.mp3'},
      {name:'Тёмный принц — Цветы',url:'assets/music/track-02.mp3'},
      {name:'Это любовь',url:'assets/music/track-03.mp3'}
    ], index=0, repeat=false, shuffle=false, objectUrls=[];
    const fmt=n=>{if(!Number.isFinite(n))return '0:00';const m=Math.floor(n/60),s=Math.floor(n%60);return `${m}:${String(s).padStart(2,'0')}`};
    function setTrack(i,play=false){if(!tracks.length)return;index=(i+tracks.length)%tracks.length;audio.src=tracks[index].url;document.querySelector('#trackName').textContent=tracks[index].name;document.querySelector('#trackSub').textContent=`Трек ${index+1} из ${tracks.length}`;document.querySelector('#cover').src=tracks[index].cover||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g"><stop stop-color="#f5bd88"/><stop offset="1" stop-color="#572619"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><text x="50" y="64" text-anchor="middle" font-size="50" fill="#ffe0bd">♡</text></svg>');document.querySelectorAll('.song').forEach((b,j)=>b.classList.toggle('active',j===index));if(play)audio.play().catch(()=>{});}
    function renderList(){const box=document.querySelector('#listbox');box.querySelectorAll('.song').forEach(x=>x.remove());document.querySelector('#empty').style.display=tracks.length?'none':'block';tracks.forEach((t,i)=>{const b=document.createElement('button');b.className='song'+(i===index?' active':'');b.textContent=`${i+1}. ${t.name}`;b.onclick=()=>setTrack(i,true);box.append(b)})}
    files.addEventListener('change',e=>{[...e.target.files].forEach(f=>{const url=URL.createObjectURL(f);objectUrls.push(url);tracks.push({name:f.name.replace(/\.[^.]+$/,''),url})});if(tracks.length){setTrack(0);renderList();document.querySelector('#listbox').classList.add('open')}files.value=''});
    document.querySelector('#addMusic').onclick=()=>files.click();document.querySelector('#playlistBtn').onclick=()=>document.querySelector('#listbox').classList.toggle('open');
    document.querySelector('#toggle').onclick=()=>{if(!tracks.length){files.click();return}if(audio.paused)audio.play().catch(()=>{});else audio.pause()};
    audio.onplay=()=>{document.querySelector('#toggle').textContent='Ⅱ';document.querySelector('#toggle').title='Пауза'};audio.onpause=()=>{document.querySelector('#toggle').textContent='▶';document.querySelector('#toggle').title='Воспроизвести'};
    document.querySelector('#prev').onclick=()=>setTrack(index-1,true);document.querySelector('#next').onclick=()=>setTrack(shuffle?Math.floor(Math.random()*tracks.length):index+1,true);audio.onended=()=>repeat?audio.play():setTrack(shuffle?Math.floor(Math.random()*tracks.length):index+1,true);
    document.querySelector('#shuffle').onclick=e=>{shuffle=!shuffle;e.currentTarget.style.color=shuffle?'#fff':'#ffbd8c'};document.querySelector('#repeat').onclick=e=>{repeat=!repeat;e.currentTarget.style.color=repeat?'#fff':'#ffbd8c'};
    audio.ontimeupdate=()=>{document.querySelector('#current').textContent=fmt(audio.currentTime);if(audio.duration){document.querySelector('#duration').textContent=fmt(audio.duration);document.querySelector('#seek').value=Math.round(audio.currentTime/audio.duration*1000)}};audio.onloadedmetadata=()=>document.querySelector('#duration').textContent=fmt(audio.duration);document.querySelector('#seek').oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/1000*audio.duration};
    const placeholders=['Место для вашего фото','Наш любимый момент','Тёплое воспоминание','Ещё одна улыбка','Всегда рядом','Этот день','Маленькое счастье','Ты ♡','Наш мир','До скорой встречи'];
    function tiles(images=[]){gallery.innerHTML='';for(let i=0;i<10;i++){const tile=document.createElement('div');tile.className='tile';if(images[i]){const im=document.createElement('img');im.src=images[i];im.alt=`Фото ${i+1}`;tile.append(im)}else{const p=document.createElement('div');p.className='placeholder';p.innerHTML=`<div><b>♡</b>${placeholders[i]}</div>`;tile.append(p)}gallery.append(tile)}}
    tiles(Array.from({length:10},(_,i)=>`assets/photos/photo-${String(i+1).padStart(2,'0')}.jpg`));renderList();setTrack(0);document.querySelector('#addPhotos').onclick=()=>document.querySelector('#imageFiles').click();document.querySelector('#imageFiles').addEventListener('change',e=>{const imgs=[...e.target.files].map(f=>{const u=URL.createObjectURL(f);objectUrls.push(u);return u});tiles(imgs);e.target.value=''});
  </script>
</body>
</html>
